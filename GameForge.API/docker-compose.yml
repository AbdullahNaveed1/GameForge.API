services:
  gameforge-db:
    image: postgres:17-alpine
    container_name: gameforge-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-gameforge_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SuperSecretPassword123!}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gameforge-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-gameforge_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  gameforge-redis:
    image: redis:7-alpine
    container_name: gameforge-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - gameforge-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  gameforge-api:
    image: gameforge-api:v1.0.0
    container_name: gameforge-api
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=gameforge-db;Port=5432;Database=${DB_NAME:-gameforge_db};Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-SuperSecretPassword123!}
      - ConnectionStrings__Redis=gameforge-redis:6379
      - Jwt__SecretKey=${JWT_SECRET:-YourUltraSecureLongSecretKeyHere123456789!}
      - Jwt__Issuer=${JWT_ISSUER:-GameForgeBackend}
      - Jwt__Audience=${JWT_AUDIENCE:-GameForgeClients}
    depends_on:
      gameforge-db:
        condition: service_healthy
      gameforge-redis:
        condition: service_healthy
    networks:
      - gameforge-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  gameforge-net:
    driver: bridge
